<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal | New Sanskar Academy Higher Secondary School</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ================= CREAMY LUXURY THEME CSS ================= */
        body {
            background-color: #fdfbf7;
            background-image:
              radial-gradient(ellipse 90% 70% at 50% -20%, rgba(217, 119, 6, 0.12), transparent),
              radial-gradient(ellipse 60% 50% at 90% 80%, rgba(5, 150, 105, 0.08), transparent),
              radial-gradient(ellipse 70% 60% at 10% 90%, rgba(37, 99, 235, 0.06), transparent);
            font-family: 'Inter', sans-serif;
            color: #0f172a;
            overflow-x: hidden;
        }
        h1, h2, h3, h4, .font-display { font-family: 'Outfit', sans-serif; }

        .glass {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(226, 218, 203, 0.85);
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.08), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        }
        .grad-text {
            background: linear-gradient(135deg, #b45309, #d97706, #059669);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-gold {
            background: linear-gradient(135deg, #d97706, #f59e0b);
            color: #0f172a;
            font-weight: 700;
            transition: all 0.3s;
        }
        .btn-gold:hover { 
            box-shadow: 0 10px 25px rgba(217, 119, 6, 0.35); 
            transform: translateY(-2px); 
        }

        .card-hover {
            transition: all 0.3s ease;
        }
        .card-hover:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 40px rgba(217, 119, 6, 0.12);
        }

        /* ================= BACKGROUND ELEMENTS ================= */
        #global-particles, #mouse-trail {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0;
        }
        .particle {
            position: absolute; color: rgba(180, 83, 9, 0.35);
            font-size: 16px; animation: floatUp linear infinite;
        }
        .dot {
            position: absolute; background: rgba(217, 119, 6, 0.4);
            border-radius: 50%; animation: twinkle ease-in-out infinite;
        }
        .blob {
            position: fixed; border-radius: 50%; filter: blur(90px);
            z-index: 0; opacity: 0.25; animation: morph 20s ease-in-out infinite;
        }
        .blob-1 { width: 400px; height: 400px; background: #059669; top: -100px; left: -100px; }
        .blob-2 { width: 500px; height: 500px; background: #d97706; bottom: -150px; right: -150px; animation-delay: -5s; }
        .blob-3 { width: 300px; height: 300px; background: #2563eb; top: 40%; left: 50%; animation-delay: -10s; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }
        @keyframes twinkle {
            0%, 100% { opacity: 0.2; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.5); }
        }
        @keyframes morph {
            0%, 100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; }
            50% { border-radius: 30% 60% 70% 40% / 50% 60% 30% 60%; }
        }

        .input-field {
            background: #faf6ee;
            border: 1px solid #e2dacb;
            border-radius: 12px; padding: 12px 16px; width: 100%;
            color: #0f172a; outline: none; transition: all 0.3s;
        }
        .input-field:focus { 
            border-color: #d97706; 
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.18); 
            background: #ffffff;
        }
        .input-field::placeholder { color: #94a3b8; }
    </style>
</head>
<body>

    <!-- Background Elements -->
    <div id="global-particles"></div>
    <div id="mouse-trail"></div>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>

    <!-- Main Container -->
    <div class="relative z-10 min-h-screen flex flex-col items-center justify-center p-4">

        <!-- Top Back Link -->
        <a href="index.html" class="absolute top-6 left-6 px-4 py-2 glass rounded-xl text-xs font-bold text-slate-700 hover:text-gold-700 hover:bg-gold-50 flex items-center gap-2 transition shadow-sm">
            <i class="fas fa-arrow-left text-gold-600"></i> Back to Website
        </a>

        <!-- ================= LOGIN VIEW ================= -->
        <div id="login-view" class="w-full max-w-md my-auto">
            <div class="glass rounded-3xl p-8 sm:p-10 w-full card-hover relative overflow-hidden border-2 border-[#ebdcc5]">
                <div class="absolute inset-0 bg-gradient-to-br from-amber-500/5 to-transparent pointer-events-none"></div>
                <div class="relative z-10">
                    <div class="text-center mb-8">
                        <div class="w-20 h-20 mx-auto mb-4 rounded-2xl bg-white border border-amber-200 flex items-center justify-center shadow-md p-2">
                            <img src="https://z-cdn-media.chatglm.cn/files/86ea5126-69b9-4081-b946-64aa0a44bd93.png?auth_key=1886449124-077c5874f267495baec4b40eaeb6d993-0-a4f5d6545971547cd066013f776aca37" alt="School Logo" class="w-full h-full object-contain">
                        </div>
                        <h2 class="text-3xl font-black grad-text tracking-tight">Login Portal</h2>
                        <p class="text-slate-600 text-xs font-semibold mt-1">New Sanskar Academy Higher Secondary School</p>
                    </div>

                    <div class="flex gap-1.5 mb-6 bg-cream-200/80 p-1.5 rounded-2xl border border-cream-300" style="background:#f4eee1">
                        <button onclick="switchRole('admin')" class="role-tab flex-1 py-2.5 rounded-xl text-xs font-bold transition">Admin</button>
                        <button onclick="switchRole('staff')" class="role-tab flex-1 py-2.5 rounded-xl text-xs font-bold transition">Staff</button>
                        <button onclick="switchRole('student')" class="role-tab flex-1 py-2.5 rounded-xl text-xs font-bold transition">Student</button>
                    </div>

                    <p id="login-error" class="hidden text-xs font-semibold text-red-600 bg-red-50 border border-red-200 rounded-xl px-3.5 py-2.5 mb-4">Invalid ID or Password</p>

                    <form onsubmit="handleLogin(event)" class="space-y-4">
                        <div>
                            <label class="text-xs font-bold text-slate-700 mb-1.5 block">User ID</label>
                            <input id="loginId" type="text" class="input-field" placeholder="Enter your ID" value="admin" required>
                        </div>
                        <div>
                            <label class="text-xs font-bold text-slate-700 mb-1.5 block">Password</label>
                            <input id="loginPass" type="password" class="input-field" placeholder="Enter password" value="admin123" required>
                        </div>
                        <button type="submit" class="btn-gold w-full py-3.5 rounded-xl mt-6 flex items-center justify-center gap-2 text-sm shadow-md">
                            <i class="fas fa-sign-in-alt"></i> Login to Dashboard
                        </button>
                        <p class="text-[11px] text-slate-500 font-medium text-center pt-2">Demo ID/Password tab switch karne par auto-fill ho jaate hain</p>
                        <p class="text-[11px] text-center pt-1">
                            <a href="#" onclick="resetTestData(event)" class="text-red-500 hover:text-red-700 font-semibold underline">Reset Test Database (Fresh Demo Data)</a>
                        </p>
                    </form>
                    <script>
                        function resetTestData(e) {
                            e.preventDefault();
                            if (confirm('Ye pura test database (attendance, marks, fees, chat) reset karke fresh demo data laayega. Continue?')) {
                                DB.reset();
                                DB.clearSession();
                                alert('Test data reset ho gaya! Ab fresh demo se login karo.');
                                location.reload();
                            }
                        }
                    </script>
                </div>
            </div>
        </div>

    </div>

    <script src="db.js"></script>
    <script>
        // ================= BACKGROUND PARTICLES =================
        const pContainer = document.getElementById('global-particles');
        const icons = ['📚', '✏️', '🎓', '🌟', '⚛️', '🧪', '🌍', '🏆', '📖'];

        for (let i = 0; i < 25; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.left = Math.random() * 100 + '%';
            p.style.animationDuration = (15 + Math.random() * 15) + 's';
            p.style.animationDelay = -Math.random() * 20 + 's';
            p.style.fontSize = (12 + Math.random() * 18) + 'px';
            p.innerText = icons[Math.floor(Math.random() * icons.length)];
            pContainer.appendChild(p);
        }

        for (let i = 0; i < 35; i++) {
            const d = document.createElement('div');
            d.className = 'dot';
            d.style.left = Math.random() * 100 + '%';
            d.style.top = Math.random() * 100 + '%';
            d.style.width = (2 + Math.random() * 3) + 'px';
            d.style.height = d.style.width;
            d.style.animationDuration = (2 + Math.random() * 4) + 's';
            d.style.animationDelay = -Math.random() * 5 + 's';
            pContainer.appendChild(d);
        }

        // ================= MOUSE TRAIL =================
        const trailContainer = document.getElementById('mouse-trail');
        document.addEventListener('mousemove', (e) => {
            const dot = document.createElement('div');
            dot.style.position = 'absolute';
            dot.style.left = e.clientX + 'px';
            dot.style.top = e.clientY + 'px';
            dot.style.width = '6px';
            dot.style.height = '6px';
            dot.style.background = 'rgba(217, 119, 6, 0.6)';
            dot.style.borderRadius = '50%';
            dot.style.pointerEvents = 'none';
            dot.style.transition = 'all 0.5s ease';
            trailContainer.appendChild(dot);

            setTimeout(() => {
                dot.style.opacity = '0';
                dot.style.transform = 'scale(3)';
            }, 10);

            setTimeout(() => {
                dot.remove();
            }, 500);
        });

        // ================= AUTH & TABS LOGIC =================
        const ROLE_DB_KEY = { admin: 'admin', staff: 'staff', student: 'students' };

        function handleLogin(e) {
            e.preventDefault();

            const id = document.getElementById('loginId').value;
            const pw = document.getElementById('loginPass').value;
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');

            const user = DB.authenticate(ROLE_DB_KEY[selectedRole], id, pw);
            if (!user) {
                errEl.textContent = 'Invalid ' + selectedRole + ' ID or Password. Check demo credentials.';
                errEl.classList.remove('hidden');
                return;
            }

            DB.setSession(user, selectedRole);

            if (selectedRole === 'staff') {
                window.location.href = 'staff-dashboard.html';
                return;
            }
            if (selectedRole === 'student') {
                window.location.href = 'student-dashboard.html';
                return;
            }
            if (selectedRole === 'admin') {
                window.location.href = 'admin-dashboard.html';
                return;
            }
        }

        let selectedRole = 'admin';

        function switchRole(role) {
            selectedRole = role;
            document.querySelectorAll('.role-tab').forEach(tab => {
                tab.classList.remove('active', 'bg-white', 'text-slate-900', 'shadow-sm');
                tab.classList.add('text-slate-600');
            });
            event.target.classList.add('active', 'bg-white', 'text-slate-900', 'shadow-sm');
            event.target.classList.remove('text-slate-600');

            const idEl = document.getElementById('loginId');
            const pwEl = document.getElementById('loginPass');
            if (idEl && pwEl) {
                if (role === 'admin') { idEl.value = 'admin'; pwEl.value = 'admin123'; }
                else if (role === 'staff') { idEl.value = 't001'; pwEl.value = 'staff123'; }
                else if (role === 'student') { idEl.value = 'S8A01'; pwEl.value = 'stud123'; }
            }
            const errEl = document.getElementById('login-error');
            if (errEl) errEl.classList.add('hidden');
        }

        // Initialize first role tab active state
        document.querySelector('.role-tab').click();
    </script>
</body>
</html>
